<!doctype html>
<html lang="ru"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Harvest Adventure</title><style>*{box-sizing:border-box}body{margin:0;background:#fff7e8;color:#382d20;font:16px/1.5 system-ui,Arial}.wrap{max-width:850px;margin:auto;padding:18px}.card{background:white;border:1px solid #eddfc8;border-radius:22px;padding:clamp(20px,5vw,36px);box-shadow:0 10px 24px #63441415}.hero{margin:30px 0;background:linear-gradient(120deg,#fff 55%,#fff0d4)}h1{font-size:clamp(2rem,7vw,3.5rem);line-height:1.05}.top{display:flex;justify-content:space-between;gap:10px}.tag{font-weight:900;color:#47723b}.muted{color:#766852}.bar{height:10px;background:#eee5d7;border-radius:9px;margin:14px 0 22px}.fill{height:100%;background:#79a75c;width:0;border-radius:9px;transition:.3s}button{font:inherit;font-weight:800;border:0;border-radius:12px;padding:11px 16px;cursor:pointer}.primary{background:#ed8b32;color:white;box-shadow:0 4px #bf6822}.secondary{background:#f8f0e3;color:#624b2d}.hidden{display:none!important}.row,.tiles{display:flex;gap:9px;flex-wrap:wrap;align-items:center;margin:16px 0}.tile{background:#fffaf1;border:2px solid #efe1ca;border-radius:13px;padding:12px;text-align:center;font-weight:800}.item{cursor:pointer;min-width:110px}.on{border-color:#70a45d;background:#f0f8e9}.emoji{display:block;font-size:1.8rem}.clue{background:#fff7e5;border-left:4px solid #eca044;padding:13px;margin:14px 0}.answer{padding:11px;border:2px solid #e8dcc8;border-radius:10px;font:inherit;width:min(100%,330px)}.feedback{min-height:30px;font-weight:800;margin:14px 0}.good{color:#38733a}.bad{color:#ae4938}footer{text-align:center;color:#766852;font-size:.85rem;margin:18px}</style><body><div class="wrap"><div class="top"><b class="tag">🍂 HARVEST ADVENTURE</b><label>Класс <select id="level"><option>1–2</option><option>3–4</option></select></label></div><section class="card hero" id="intro"><span class="tag">ENGLISH • PUZZLES • THINKING</span><h1>Операция «Спасти урожай!»</h1><p class="muted">Разгадай улики, рассчитай покупки, взломай код и запрограммируй робота-повара. Одного угадывания не хватит!</p><button class="primary" id="start">Начать миссию →</button></section><section class="card hidden" id="game"><div class="top"><b id="counter"></b><b>🌰 <span id="score">0</span></b></div><div class="bar"><div class="fill" id="fill"></div></div><div id="content"></div><div class="feedback" id="feedback"></div><div class="top"><button class="secondary" id="hint">💡 Подсказка</button><button class="primary hidden" id="next">Дальше →</button></div></section><footer>Для GitHub Pages сохраните этот файл под именем index.html.</footer></div><script>
const tasks=[
{title:'Детектив в огороде',tag:'ЛОГИКА • ENGLISH',kind:'text',desc:'Прочитай улики: <b>“It is not a fruit. It grows under the ground. It is orange. Rabbits love it.”</b><br>Какой овощ пропал? Введи слово по-английски.',hint:'Овощ, оранжевый, растёт под землёй, любим кроликами.',ans:['carrot'],win:'Дело закрыто! Это carrot — морковь.'},
{title:'Рынок с четырьмя монетами',tag:'СЧЁТ • АНГЛИЙСКИЙ',kind:'market',desc:'У тебя 4 монетки. Купи ровно один fruit и ровно один vegetable, потратив все 4.',hint:'Нужны два товара разных типов: один fruit и один vegetable. Сумма — ровно 4.',goods:[['🍎','apple','fruit',2],['🍐','pear','fruit',3],['🥕','carrot','vegetable',2],['🥔','potato','vegetable',1],['🎃','pumpkin','vegetable',4]],win:'Умная покупка! Ты соблюл(а) оба условия и бюджет.'},
{title:'Секретный код фермера',tag:'АНАГРАММА • SPELLING',kind:'text',desc:'Буквы осеннего фрукта перепутались: <b>RPAE</b>. Переставь их и введи слово. Подсказка: начинается на P.',hint:'Переставь буквы R, P, A, E. Это фрукт — pear.',ans:['pear'],win:'Код взломан! RPAE → PEAR.'},
{title:'Программируем робота-повара',tag:'АЛГОРИТМ • ENGLISH',kind:'sequence',desc:'Робот хочет съесть яблоко. Нажимай карточки в правильном порядке: от сбора до перекуса.',hint:'Сначала сорви, потом помой, затем нарежь и только после этого съешь.',steps:['Pick an apple','Wash the apple','Cut the apple','Eat the apple'],ru:['сорвать яблоко','помыть яблоко','нарезать яблоко','съесть яблоко'],win:'Робот выполнил алгоритм без ошибок!'},
{title:'Кто принёс тыкву?',tag:'ЧТЕНИЕ • ВЫВОДЫ',kind:'text',desc:'Улики: <b>“Mia brought apples. Leo did not bring fruit. Nina brought the orange item used to make a jack-o’-lantern. Omar brought pears.”</b><br>Кто принёс pumpkin? Введи имя по-английски.',hint:'Pumpkin — тыква. Ищи того, кто принёс оранжевый предмет для jack-o’-lantern.',ans:['nina'],win:'Верно — Nina принесла pumpkin! Ты внимательно прочитал(а) улики.'}
];let n=0,score=0,chosen=new Set(),order=[];const $=q=>document.querySelector(q);$('#start').onclick=()=>{$('#intro').classList.add('hidden');$('#game').classList.remove('hidden');draw()};
function draw(){chosen.clear();order=[];let t=tasks[n];$('#counter').textContent=`Испытание ${n+1} из 5 · ${t.tag}`;$('#fill').style.width=(n/5*100)+'%';$('#feedback').textContent='';$('#feedback').className='feedback';$('#next').classList.add('hidden');let h=`<h2>${t.title}</h2><p class="muted">${t.desc}</p>`;if(t.kind==='market'){h+='<div class="tiles">'+t.goods.map(([e,w,type,c])=>`<button class="tile item" data-word="${w}" data-type="${type}" data-cost="${c}"><span class="emoji">${e}</span>${w}<br><small>${c} 🪙</small></button>`).join('')+'</div><p id="total">Корзина пуста · бюджет 4 монетки</p><button class="primary" id="check">Проверить</button>'}else if(t.kind==='sequence'){let list=[...t.steps].sort(()=>Math.random()-.5);h+='<p>Составь последовательность:</p><div class="tiles">'+list.map(x=>`<button class="tile seq" data-word="${x}">${x}<br><small>${t.ru[t.steps.indexOf(x)]}</small></button>`).join('')+'</div><p id="line">Твой порядок: пока пусто</p><button class="secondary" id="reset">Сбросить</button> <button class="primary" id="check">Проверить</button>'}else{h+='<div class="row"><input class="answer" id="answer" placeholder="Ответ по-английски"><button class="primary" id="check">Проверить</button></div>'}$('#content').innerHTML=h;
if(t.kind==='market')document.querySelectorAll('.item').forEach(b=>b.onclick=()=>{let w=b.dataset.word;if(chosen.has(w)){chosen.delete(w);b.classList.remove('on')}else{chosen.add(w);b.classList.add('on')}let sum=[...chosen].reduce((s,x)=>s+ +document.querySelector(`[data-word="${x}"]`).dataset.cost,0);$('#total').textContent=`Выбрано ${chosen.size} товара · ${sum} из 4 монет`});if(t.kind==='sequence'){document.querySelectorAll('.seq').forEach(b=>b.onclick=()=>{if(order.includes(b.dataset.word))return;order.push(b.dataset.word);b.disabled=true;$('#line').textContent='Твой порядок: '+order.join(' → ')});$('#reset').onclick=draw}$('#check').onclick=check;if($('#answer'))$('#answer').onkeydown=e=>{if(e.key==='Enter')check()};$('#hint').onclick=()=>msg('💡 '+t.hint,'')}
function msg(s,c){$('#feedback').textContent=s;$('#feedback').className='feedback '+c}function check(){let t=tasks[n],ok=false;if(t.kind==='text')ok=t.ans.includes($('#answer').value.trim().toLowerCase().replace(/[.!?]/g,''));if(t.kind==='market'){let a=[...chosen].map(w=>document.querySelector(`[data-word="${w}"]`)),types=a.map(x=>x.dataset.type),sum=a.reduce((s,x)=>s+ +x.dataset.cost,0);ok=a.length===2&&sum===4&&types.includes('fruit')&&types.includes('vegetable')}if(t.kind==='sequence')ok=order.length===4&&order.every((x,j)=>x===t.steps[j]);if(!ok){msg('Пока не сходится. Перечитай условие, проверь подсчёт или порядок и попробуй ещё раз.','bad');return}score+=10;$('#score').textContent=score;msg('✅ '+t.win,'good');$('#next').classList.remove('hidden');document.querySelectorAll('#content button').forEach(b=>b.disabled=true)}$('#next').onclick=()=>{n++;if(n<5){draw();return}$('#fill').style.width='100%';$('#counter').textContent='Миссия завершена';$('#content').innerHTML=`<div style="text-align:center;padding:20px"><div style="font-size:4rem">🏆🧺</div><h2>Урожай спасён — ты Harvest Hero!</h2><p>Ты применил(а) логику, чтение, счёт и английский.</p><h3>Результат: ${score} из 50 желудей</h3><p>Бонус: придумай свою английскую загадку про фрукт или овощ.</p><button class="primary" onclick="location.reload()">Сыграть заново</button></div>`;$('#feedback').textContent='';$('#next').classList.add('hidden')};$('#level').onchange=()=>{if(!$('#game').classList.contains('hidden'))draw()};
</script></body></html>
